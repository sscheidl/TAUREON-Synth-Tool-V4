name: Windows CI

on:
  push:
  pull_request:

jobs:
  bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/ci -A x64
      - name: Build
        run: cmake --build build/ci --config Debug --parallel
      - name: Test
        run: ctest --test-dir build/ci -C Debug --output-on-failure
