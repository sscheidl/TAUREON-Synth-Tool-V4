name: Windows CI

on:
  push:
  pull_request:

jobs:
  bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/ci -A x64
          -DTAUREON_BUILD_STAGE1_SPIKES=OFF
          -DTAUREON_ENABLE_WMS_TRANSPORT=OFF
          -DTAUREON_ENABLE_LOCAL_MIDI_INTEGRATION_TESTS=OFF
      - name: Build
        run: cmake --build build/ci --config Debug --parallel
      - name: Test environment-independent Stage 2 and Stage 3 suite
        run: ctest --test-dir build/ci -C Debug -L ci --output-on-failure
