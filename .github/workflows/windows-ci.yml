name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine-consumer:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build, test and install both engine configurations without Qt
        shell: pwsh
        run: |
          cmake -S . -B build/engine -G "Visual Studio 17 2022" -A x64 -T v143 `
            -DTAUREON_BUILD_PRODUCT_APP=OFF -DBUILD_TESTING=ON `
            -DCMAKE_INSTALL_PREFIX="$PWD/build/engine-install"
          foreach ($configuration in @('Debug', 'Release')) {
            cmake --build build/engine --config $configuration --parallel
            ctest --test-dir build/engine -C $configuration --output-on-failure
            cmake --install build/engine --config $configuration
          }
      - name: Build and run separate consumer in both configurations
        shell: pwsh
        run: |
          cmake -S tests/consumer -B build/consumer -G "Visual Studio 17 2022" -A x64 -T v143 `
            -DCMAKE_PREFIX_PATH="$PWD/build/engine-install"
          foreach ($configuration in @('Debug', 'Release')) {
            cmake --build build/consumer --config $configuration --parallel
            ctest --test-dir build/consumer -C $configuration --output-on-failure
          }

  software:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      QT_VERSION: 6.10.3
      QT_ARCH: win64_msvc2022_64
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check PR diff whitespace
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Set up Python for aqtinstall
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.3'

      - name: Install Qt
        uses: jurplel/install-qt-action/action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '${{ env.QT_VERSION }}'
          host: windows
          target: desktop
          arch: '${{ env.QT_ARCH }}'
          dir: '${{ runner.temp }}/taureon-qt'
          cache: 'false'
          set-env: 'true'
          add-tools-to-path: 'false'
          aqtversion: '==3.3.0'
          py7zrversion: '==1.0.0'

      - name: Report toolchain versions
        shell: pwsh
        run: |
          cmake --version
          qmake --version
          python --version
          Write-Host "QT_ROOT_DIR=$env:QT_ROOT_DIR"

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products * -version "[17.0,18.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) { throw "Visual Studio 2022 with the v143 C++ toolset was not found." }

          $toolset = Get-ChildItem (Join-Path $vsInstall "VC\Tools\MSVC") -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          $compiler = Join-Path $toolset.FullName "bin\Hostx64\x64\cl.exe"
          if (-not (Test-Path $compiler)) { throw "The x64 MSVC compiler was not found at $compiler." }

          $compilerInfo = (Get-Item $compiler).VersionInfo
          Write-Host "Visual Studio installation: $vsInstall"
          Write-Host "MSVC v143 toolset directory: $($toolset.Name)"
          Write-Host "cl.exe product version: $($compilerInfo.ProductVersion)"
          Write-Host "cl.exe file version: $($compilerInfo.FileVersion)"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64 -T v143 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DBUILD_TESTING=ON `
            -DTAUREON_BUILD_STAGE1_SPIKES=OFF `
            -DTAUREON_ENABLE_WMS_TRANSPORT=OFF `
            -DTAUREON_ENABLE_LOCAL_MIDI_INTEGRATION_TESTS=OFF

      - name: Build complete software configuration
        run: cmake --build build/ci --config Debug --parallel

      - name: Render Stage 5 GUI visual previews
        shell: pwsh
        env:
          QT_QPA_PLATFORM: 'offscreen:configfile=tests/fixtures/offscreen-1920x1080.json'
        run: |
          $previewDirectory = Join-Path $PWD "build/ci/stage5-gui-preview"
          & ".\\build\\ci\\tests\\Debug\\stage5_gui_preview_capture.exe" $previewDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $expected = @(
            "01-midi-monitor.png",
            "02-sysex-transfer.png",
            "03-sysex-manager.png",
            "04-librarian.png",
            "05-devices-and-profiles.png",
            "06-diagnostics.png",
            "07-settings.png"
          )
          foreach ($fileName in $expected) {
            if (-not (Test-Path (Join-Path $previewDirectory $fileName))) {
              throw "Missing Stage 5 GUI preview: $fileName"
            }
          }

      - name: Upload Stage 5 GUI visual previews
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02a # v4
        with:
          name: stage5-gui-preview-1920x1080
          path: build/ci/stage5-gui-preview
          if-no-files-found: error
          retention-days: 14

      - name: Enumerate configured tests
        shell: pwsh
        run: |
          ctest --test-dir build/ci -C Debug -N
          ctest --test-dir build/ci -C Debug -N -L local-midi

      - name: Test all cloud-capable software
        run: ctest --test-dir build/ci -C Debug -LE local-midi --output-on-failure

      # Package only push runs: there github.sha is the exact pushed commit. A pull_request
      # run checks out GitHub's synthetic merge ref, which would mislabel the bundle.
      - name: Acquire pinned Windows MIDI Services build dependencies
        if: github.event_name == 'push'
        shell: pwsh
        run: .\tools\AcquireWmsDependencies.ps1

      - name: Configure internal hardware-test build
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          cmake -S . -B build/hardware-test -G "Visual Studio 17 2022" -A x64 -T v143 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DBUILD_TESTING=OFF `
            -DTAUREON_BUILD_STAGE1_SPIKES=OFF `
            -DTAUREON_ENABLE_WMS_TRANSPORT=ON `
            -DTAUREON_BUILD_REVISION="${{ github.sha }}"

      - name: Build internal hardware-test executable
        if: github.event_name == 'push'
        run: cmake --build build/hardware-test --config RelWithDebInfo --target taureon_app --parallel

      - name: Assemble and smoke-test portable hardware-test folder
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $sourceExecutable = Join-Path $PWD "build\hardware-test\src\RelWithDebInfo\taureon_app.exe"
          $bundleDirectory = Join-Path $PWD "build\TAUREON-V4-hardware-test-win64"
          $bundleExecutable = Join-Path $bundleDirectory "TAUREON-Synth-Tool-V4.exe"

          if (-not (Test-Path -LiteralPath $sourceExecutable -PathType Leaf)) {
            throw "Hardware-test executable was not produced at $sourceExecutable"
          }

          New-Item -ItemType Directory -Force -Path $bundleDirectory | Out-Null
          Copy-Item -LiteralPath $sourceExecutable -Destination $bundleExecutable
          Copy-Item -LiteralPath (Join-Path $PWD 'docs/licenses/Windows-MIDI-Services-MIT.txt') `
            -Destination $bundleDirectory
          Copy-Item -LiteralPath (Join-Path (Split-Path $sourceExecutable) "resources") `
            -Destination (Join-Path $bundleDirectory "resources") -Recurse
          $profiles = Get-ChildItem -LiteralPath (Join-Path $bundleDirectory "resources\device_profiles") -Filter *.profile.json -File
          if (-not $profiles) { throw "Device profiles are missing from the hardware-test folder" }

          & windeployqt --release --no-translations --dir $bundleDirectory $bundleExecutable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # App-local MSVC v143 runtime so the portable folder also starts without the VC++ redistributable.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products * -version "[17.0,18.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $crtDirectory = Get-ChildItem (Join-Path $vsInstall "VC\Redist\MSVC") -Directory |
            Where-Object Name -match '^\d+(\.\d+)+$' |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\Microsoft.VC143.CRT" } |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $crtDirectory) { throw "MSVC v143 x64 runtime redistributable was not found" }
          Copy-Item -Path (Join-Path $crtDirectory "*.dll") -Destination $bundleDirectory

          $notice = @"
          TAUREON Synth Tool V4 - internal hardware-test build

          Revision: ${{ github.sha }}
          Source branch: ${{ github.ref_name }}

          Start TAUREON-Synth-Tool-V4.exe from this folder. Keep all DLL and
          subfolders beside the EXE. This is an experimental validation build,
          not a release. Real MIDI/SysEx behavior is not yet accepted until the
          Product Owner records the physical-hardware results.

          WMS API target: Windows.Devices.Midi2 0.99.88-preview.10.
          Requires Windows 11 25H2 or newer with Windows MIDI Services available.
          This public workflow artifact excludes Microsoft's preview API files.
          WMS uses the API installed with the Windows MIDI Services Tools, one
          provided by Windows, or permitted app-local API files under Microsoft's terms.
          See docs/reference/WMS_DEPENDENCIES.md in the source repository.
          The WinMM backend remains available independently.
          "@
          $notice.Trim() | Set-Content -LiteralPath (Join-Path $bundleDirectory "INTERNAL-TEST-BUILD.txt") -Encoding utf8

          Push-Location $bundleDirectory
          try {
            # Public-repository artifacts are public distribution. Do not ship
            # the preview API until its customer-preview terms are met.
            if (Test-Path -LiteralPath (Join-Path $bundleDirectory 'Windows.Devices.Midi2.dll')) {
              throw 'Preview WMS API must not be included in this public artifact'
            }
            if (Test-Path -LiteralPath (Join-Path $bundleDirectory 'Windows.Devices.Midi2.pri')) {
              throw 'Preview WMS API resources must not be included in this public artifact'
            }
            & $bundleExecutable --smoke-test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            Get-ChildItem -File -Recurse |
              Where-Object Name -ne "SHA256SUMS.txt" |
              Sort-Object FullName |
              ForEach-Object {
                $relativePath = [IO.Path]::GetRelativePath($bundleDirectory, $_.FullName)
                $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
                "$hash  $relativePath"
              } | Set-Content -LiteralPath (Join-Path $bundleDirectory "SHA256SUMS.txt") -Encoding ascii
          }
          finally {
            Pop-Location
          }

      - name: Upload internal Windows hardware-test build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02a # v4
        with:
          name: TAUREON-V4-hardware-test-win64-${{ github.sha }}
          path: build/TAUREON-V4-hardware-test-win64
          if-no-files-found: error
          retention-days: 14

  release:
    # A pushed v* tag turns the portable folder built above into a GitHub pre-release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [engine-consumer, software]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check tag against the application version and release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base="${version%%-*}"
          suffix="${version#*-}"
          grep -q "VERSION ${base} " CMakeLists.txt || { echo "CMake project version is not ${base}"; exit 1; }
          if [ "$suffix" != "$version" ]; then
            grep -qF "\${PROJECT_VERSION}-${suffix}\"" src/CMakeLists.txt ||
              { echo "TAUREON_APP_VERSION suffix is not ${suffix}"; exit 1; }
          fi
          test -f "docs/release/${GITHUB_REF_NAME}.md" ||
            { echo "Missing docs/release/${GITHUB_REF_NAME}.md"; exit 1; }

      - name: Download portable folder built for this commit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: TAUREON-V4-hardware-test-win64-${{ github.sha }}
          path: dist/TAUREON-Synth-Tool-V4-${{ github.ref_name }}-win64

      - name: Package release ZIP
        shell: bash
        run: |
          set -euo pipefail
          name="TAUREON-Synth-Tool-V4-${GITHUB_REF_NAME}-win64"
          folder="dist/${name}"
          test -f "${folder}/TAUREON-Synth-Tool-V4.exe"
          # Public release: Microsoft's preview API files must not be redistributed.
          test ! -e "${folder}/Windows.Devices.Midi2.dll"
          test ! -e "${folder}/Windows.Devices.Midi2.pri"
          rm -f "${folder}/INTERNAL-TEST-BUILD.txt" "${folder}/SHA256SUMS.txt"
          mkdir -p "${folder}/licenses"
          mv "${folder}/Windows-MIDI-Services-MIT.txt" "${folder}/licenses/"
          cp docs/licenses/Qt-GPL-3.0-only.txt docs/licenses/Qt-LGPL-3.0-only.txt \
             docs/licenses/ICU-LICENSE.txt "${folder}/licenses/"
          cp LICENSE "${folder}/LICENSE.txt"
          cp docs/release/THIRD-PARTY-NOTICES.txt "${folder}/"
          sed -e "s/@VERSION@/${GITHUB_REF_NAME#v}/" -e "s/@REVISION@/${GITHUB_SHA}/" \
            docs/release/ALPHA-README.txt.in > "${folder}/ALPHA-README.txt"
          (cd "$folder" && find . -type f ! -name SHA256SUMS.txt -printf '%P\n' | LC_ALL=C sort |
            xargs -d '\n' sha256sum > SHA256SUMS.txt)
          (cd dist && zip -qrX "${name}.zip" "$name" &&
            sha256sum "${name}.zip" > "SHA256SUMS-${GITHUB_REF_NAME}.txt")

      - name: Publish GitHub pre-release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/TAUREON-Synth-Tool-V4-${GITHUB_REF_NAME}-win64.zip" \
            "dist/SHA256SUMS-${GITHUB_REF_NAME}.txt" \
            --verify-tag --prerelease \
            --title "TAUREON Synth Tool V4 ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/release/${GITHUB_REF_NAME}.md"
